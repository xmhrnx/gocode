<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GoCode tab</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; background: #ffffff; color: #111827; }
    @media (prefers-color-scheme: dark) { body { background: #18181b; color: #f4f4f5; } }
    main { max-width: 420px; padding: 24px; text-align: center; }
    p { opacity: .7; }
  </style>
</head>
<body>
  <main>
    <img src="icon-128.png" alt="" width="64" height="64">
    <h1>This tab is shared with GoCode</h1>
    <p>Ask the agent in GoCode to open a site here. To stop, click the GoCode button in the toolbar and choose Stop.</p>
  </main>
</body>
</html>
