[app]
name = "GoCode Remote"
id = "dev.gocode.remote"
version = "0.1.0"
build = 1
icon = "../assets/icon.png"
package = "."
platforms = ["android", "ios"]
publisher = "Mehran Zahiroddini"
description = "Follow and steer GoCode on your computer from your phone."
website = "https://xmhrnx.github.io/gocode/"

[android]
target_sdk = 35
# The connection to the desktop, and finding it on the Wi-Fi.
permissions = ["network", "networkstate", "android.permission.ACCESS_WIFI_STATE"]
notifications = false

[ios]
min_os = 15

[ios.plist]
NSLocalNetworkUsageDescription = "GoCode Remote finds and connects to GoCode on your computer over your local network."
ITSAppUsesNonExemptEncryption = false
